name: Test and publish GitHub Pages redirect

# The app is self-hosted on ajmsd (see selfhost/), which pulls master and
# deploys itself. GitHub Pages only serves a redirect to the new domain.

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.6.7

      - name: Type-check and unit-test the API server
        run: |
          deno check --config server/deno.json server/main.ts server/migrate.ts
          deno test --config server/deno.json --no-lock -A server/unit_test.ts

  redirect:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Publish redirect to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.github/pages-redirect
