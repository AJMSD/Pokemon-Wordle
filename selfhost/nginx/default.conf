# API gateway (auth, REST, edge functions) and static site server.
# Upstreams are resolved per-request via Docker DNS so container restarts
# don't leave stale IPs.

resolver 127.0.0.11 valid=10s ipv6=off;

# ---- Per-client rate limits ----
# Traffic only arrives via the Cloudflare tunnel (ports bind to 127.0.0.1), so
# CF-Connecting-IP is the real client IP and can't be spoofed.
map $http_cf_connecting_ip $client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

limit_req_zone  $client_ip zone=api:10m        rate=10r/s;  # all API calls
limit_req_zone  $client_ip zone=guess:10m      rate=2r/s;   # submit-guess
limit_req_zone  $client_ip zone=auth_email:10m rate=5r/m;   # endpoints that send email
limit_req_zone  $client_ip zone=auth:10m       rate=2r/s;   # sign-in, token refresh, etc.
limit_req_zone  $client_ip zone=site:10m       rate=20r/s;  # static site
limit_conn_zone $client_ip zone=conn:10m;

# Browser origins allowed to call auth/rest (see cors.inc).
map $http_origin $cors_origin {
  default                               "";
  "https://wurmple.ajmsd.space"         $http_origin;
  "~^http://localhost(:[0-9]+)?$"       $http_origin;
}

limit_req_status  429;
limit_conn_status 429;

# ---- API: wurmple-api.ajmsd.space ----
server {
  listen 8000;
  client_max_body_size 1m;
  limit_conn conn 30;
  limit_req zone=api burst=40 nodelay;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $client_ip;
  proxy_set_header X-Forwarded-For $client_ip;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;

  location ~ ^/auth/v1/(signup|recover|otp|magiclink|resend)$ {
    include /etc/nginx/conf.d/cors.inc;
    limit_req zone=auth_email burst=5 nodelay;
    limit_req zone=api burst=40 nodelay;
    set $upstream http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location /functions/v1/submit-guess {
    limit_req zone=guess burst=10 nodelay;
    limit_req zone=api burst=40 nodelay;
    set $upstream http://functions:9000;
    rewrite ^/functions/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location /auth/v1/ {
    include /etc/nginx/conf.d/cors.inc;
    limit_req zone=auth burst=20 nodelay;
    limit_req zone=api burst=40 nodelay;
    set $upstream http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location /rest/v1/ {
    include /etc/nginx/conf.d/cors.inc;
    set $upstream http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location /functions/v1/ {
    set $upstream http://functions:9000;
    rewrite ^/functions/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_read_timeout 150s;
  }

  location / {
    return 404;
  }
}

# ---- Internal API for edge functions (not published, no rate limits) ----
# Functions call auth/rest on every request; those calls carry no client IP,
# so they must not share the public per-IP buckets.
server {
  listen 8001;
  client_max_body_size 1m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;

  location /auth/v1/ {
    set $upstream http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location /rest/v1/ {
    set $upstream http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location / {
    return 404;
  }
}

# ---- Site: wurmple.ajmsd.space ----
server {
  listen 8080;
  root /usr/share/nginx/html;
  limit_conn conn 30;
  limit_req zone=site burst=100 nodelay;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Self-hosted sprites are not content-hashed, so cache long but not immutable.
  location /sprites/ {
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
