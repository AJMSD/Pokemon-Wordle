# API gateway and static site server.
# The api upstream is resolved per-request via Docker DNS so container
# restarts don't leave stale IPs.

resolver 127.0.0.11 valid=10s ipv6=off;

# ---- Per-client rate limits ----
# Traffic only arrives via the Cloudflare tunnel (ports bind to 127.0.0.1), so
# CF-Connecting-IP is the real client IP and can't be spoofed.
map $http_cf_connecting_ip $client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

limit_req_zone  $client_ip zone=api:10m        rate=10r/s;  # all API calls
limit_req_zone  $client_ip zone=guess:10m      rate=2r/s;   # submit-guess
limit_req_zone  $client_ip zone=auth_email:10m rate=5r/m;   # endpoints that send email
limit_req_zone  $client_ip zone=auth:10m       rate=2r/s;   # sign-in, verify, reset, Google
limit_req_zone  $client_ip zone=site:10m       rate=20r/s;  # static site
limit_conn_zone $client_ip zone=conn:10m;

limit_req_status  429;
limit_conn_status 429;

# ---- API: wurmple-api.ajmsd.space ----
# The API answers CORS (and preflights, cached for a day) itself.
server {
  listen 8000;
  client_max_body_size 1m;
  limit_conn conn 30;
  limit_req zone=api burst=40 nodelay;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $client_ip;
  proxy_set_header X-Forwarded-For $client_ip;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  set $upstream http://api:8000;

  location ~ ^/v1/auth/(signup|recover|resend)$ {
    limit_req zone=auth_email burst=5 nodelay;
    limit_req zone=api burst=40 nodelay;
    proxy_pass $upstream;
  }

  location /v1/auth/ {
    limit_req zone=auth burst=20 nodelay;
    limit_req zone=api burst=40 nodelay;
    proxy_pass $upstream;
  }

  location = /v1/submit-guess {
    limit_req zone=guess burst=10 nodelay;
    limit_req zone=api burst=40 nodelay;
    proxy_pass $upstream;
  }

  location /v1/ {
    proxy_pass $upstream;
    proxy_read_timeout 60s;
  }

  location / {
    return 404;
  }
}

# ---- Site: wurmple.ajmsd.space ----
server {
  listen 8080;
  root /usr/share/nginx/html;
  limit_conn conn 30;
  limit_req zone=site burst=100 nodelay;

  # Server-level copy covers any location that adds no headers of its own.
  include /etc/nginx/conf.d/security-headers.inc;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Self-hosted sprites are not content-hashed, so cache long but not immutable.
  location /sprites/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
