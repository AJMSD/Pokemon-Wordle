# Replaces Supabase's Kong/Envoy gateway (~200MB) with nginx (~10MB).
# Upstreams are resolved per-request via Docker DNS so container restarts
# don't leave stale IPs.

resolver 127.0.0.11 valid=10s ipv6=off;

# ---- API: wurmple-api.ajmsd.space ----
server {
  listen 8000;
  client_max_body_size 1m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;

  location /auth/v1/ {
    set $upstream http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location /rest/v1/ {
    set $upstream http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
  }

  location /functions/v1/ {
    set $upstream http://functions:9000;
    rewrite ^/functions/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_read_timeout 150s;
  }

  location / {
    return 404;
  }
}

# ---- Site: wurmple.ajmsd.space ----
server {
  listen 8080;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
