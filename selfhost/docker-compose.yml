# Lean self-hosted backend for Wurmple (Pokémon Wordle).
# Only the services the app uses: Postgres, GoTrue (auth), PostgREST (used by
# edge functions via supabase-js), Edge Runtime, and an nginx gateway that also
# serves the built frontend. Realtime, Storage, Studio, analytics, imgproxy,
# and the pooler are intentionally omitted to keep idle RAM low.
#
# Ports are bound to 127.0.0.1 only; public traffic arrives via cloudflared.

name: wurmple

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - max_wal_size=256MB
      - -c
      - log_min_messages=fatal

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DB_MAX_POOL_SIZE: 5

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}/auth/v1

      GOTRUE_PASSWORD_MIN_LENGTH: 6
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      # 12/hour caps auth email at 288/day, under Brevo free tier (300/day)
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 12
      # Rate-limit per real client IP (set by Cloudflare), not per proxy
      GOTRUE_RATE_LIMIT_HEADER: CF-Connecting-IP
      GOTRUE_MAILER_EXTERNAL_HOSTS: wurmple-api.ajmsd.space

      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_POOL: 5
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  functions:
    image: supabase/edge-runtime:v1.76.2
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - gateway
    volumes:
      - ../supabase/functions:/home/deno/functions:ro
      # Functions import shared game logic via ../../../src/logic/*
      - ../src:/home/src:ro
      - ./functions-main:/home/deno/main:ro
      - deno-cache:/root/.cache/deno
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://gateway:8001 # internal, unthrottled listener
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      VERIFY_JWT: "true"
      # Functions reachable without a JWT (hosted equivalent: --no-verify-jwt)
      PUBLIC_FUNCTIONS: health,validate-email
    command: ["start", "--main-service", "/home/deno/main"]

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "127.0.0.1:54321:8000" # API  -> wurmple-api.ajmsd.space
      - "127.0.0.1:54380:8080" # site -> wurmple.ajmsd.space
    volumes:
      # Directory mount: single-file binds keep the old inode when git replaces the file.
      - ./nginx:/etc/nginx/conf.d:ro
      - ./site:/usr/share/nginx/html:ro

volumes:
  db-data:
  db-config:
  deno-cache:
