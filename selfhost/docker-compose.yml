# Self-hosted backend for Wurmple (Pokémon Wordle):
#   postgres  plain Postgres 17
#   api       the Deno API server in ../server (game + accounts)
#   gateway   nginx: per-IP rate limits, the API, and the built frontend
#
# Ports bind to 127.0.0.1 only; public traffic arrives via cloudflared.
# GATEWAY_API_PORT / GATEWAY_SITE_PORT let a second copy (staging) run alongside.

name: wurmple

# Cap container log size so json-file logs can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wurmple
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "wurmple", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - max_wal_size=256MB

  api:
    image: denoland/deno:2.6.7
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ../server:/app/server:ro
      # Shared game logic and the Pokémon name list (imported as ../src/*).
      - ../src:/app/src:ro
      - ../db:/app/db:ro
      - deno-cache:/deno-dir
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: wurmple
      DB_POOL_SIZE: 10
      PORT: 8000
      # Salt for per-user daily targets. Never change it: every player's
      # Pokémon would change (see RUNBOOK "Secrets").
      TARGET_SALT: ${TARGET_SALT:?set TARGET_SALT in .env}
      SITE_URL: ${SITE_URL}
      API_URL: ${API_URL}
      MAIL_MODE: ${MAIL_MODE:-smtp}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
    command:
      - run
      - --config=server/deno.json
      - --frozen
      - --allow-net
      - --allow-env
      - --allow-sys
      - --allow-read=/app
      - server/main.ts
    healthcheck:
      # The image has no curl/wget; deno itself does the probe.
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:8000/v1/health'); Deno.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 3s

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 32m
    ports:
      - "127.0.0.1:${GATEWAY_API_PORT:-54321}:8000" # API  -> wurmple-api.ajmsd.space
      - "127.0.0.1:${GATEWAY_SITE_PORT:-54380}:8080" # site -> wurmple.ajmsd.space
    volumes:
      # Directory mount: single-file binds keep the old inode when git replaces the file.
      - ./nginx:/etc/nginx/conf.d:ro
      - ./site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 && nc -z 127.0.0.1 8080"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  deno-cache:
